<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NESST Tree Watering Map</title>
<meta name="description" content="Which of the NESST street trees need watering, updated from volunteer tag taps and local rainfall.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css"/>
<script src="vendor/leaflet/leaflet.js"></script>
<link rel="stylesheet" href="vendor/leaflet.markercluster/MarkerCluster.css"/>
<script src="vendor/leaflet.markercluster/leaflet.markercluster.js"></script>
<style>
  html,body,#map{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,sans-serif}
  .panel{background:#fff;border-radius:10px;box-shadow:0 1px 5px rgba(0,0,0,.25);
    font-size:13px;color:#1f2d24;line-height:1.35}
  .legend{padding:8px 10px;max-width:220px}
  .legend .row{display:flex;align-items:center;gap:7px;margin:2px 0}
  .dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff;
    box-shadow:0 0 0 1px rgba(0,0,0,.15);flex:none;box-sizing:content-box}
  .dot.small{width:7px;height:7px;margin:0 2.5px}
  .dot.hollow{background:#fff;box-shadow:none;border-color:#1f2d24}
  .legend .note{color:#56645b;font-size:11.5px;margin-top:6px}
  .legend .shapes{display:flex;gap:12px;margin-top:6px;padding-top:6px;border-top:1px solid #e3e9e4}
  .legend .ramp{margin:4px 0 2px}
  .legend .ramp .bar{height:9px;border-radius:5px}
  .legend .ramp .ends{display:flex;justify-content:space-between;font-size:11.5px;color:#56645b;margin-top:2px}
  /* The list of trees needing water sits above the other panels when open */
  .leaflet-top.leaflet-right{z-index:1001}
  .due{max-width:240px}
  .due.open{width:min(340px, calc(100vw - 70px));max-width:none}
  .due button{all:unset;cursor:pointer;display:block;padding:7px 11px;font-weight:600}
  .due .drop{max-height:calc(100vh - 75px);max-height:calc(100dvh - 75px);overflow:auto;
    border-top:1px solid #e3e9e4}
  .due .head{margin:0;padding:8px 11px;color:#56645b;font-size:12px;background:#f6f8f6;
    border-bottom:1px solid #e3e9e4}
  .due .head b{color:#1f2d24}
  .due ol{list-style:none;margin:0;padding:0 0 4px}
  .due li{display:flex;gap:7px;align-items:center;padding:7px 11px;cursor:pointer;border-bottom:1px solid #f0f3f0}
  .due li:hover{background:#f1f5f1}
  /* "!" badge for newly planted trees that are overdue */
  .flag{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;background:#1f2d24;color:#fff;
    font:700 11px/16px system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 0 0 1.5px #fff}
  .flag.sm{width:14px;height:14px;font-size:10px;line-height:14px;margin-right:3px;vertical-align:-2px}
  .cl{position:relative;width:34px;height:34px}
  .cl .flag{position:absolute;top:-6px;right:-8px;width:auto;min-width:16px;padding:0 4px;border-radius:8px;
    box-sizing:border-box;font-size:10.5px}
  .due button .flag{margin-left:4px;vertical-align:-2px}
  .due li .n{color:#56645b;font-size:12px;min-width:1.6em;text-align:right;font-variant-numeric:tabular-nums}
  .due li .t{min-width:0}
  .due li .sub{display:block;color:#56645b;font-size:12px}
  .due li small{color:#1f2d24;font-weight:600;margin-left:auto;white-space:nowrap;padding-left:6px}
  .locate{all:unset;cursor:pointer;width:30px;height:30px;display:flex;align-items:center;
    justify-content:center;background:#fff;font-size:17px}
  .toast button{font:inherit;margin-left:6px}
  .toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:1000;
    background:#1f2d24;color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;
    max-width:80vw;text-align:center}
  .preview{padding:7px 9px;display:flex;flex-direction:column;gap:6px;max-width:220px}
  .preview .pv-note{font-size:11.5px;color:#8a4b00;max-width:200px}
  .preview .pv-title{font-weight:600;font-size:12px;color:#56645b}
  .preview .pv-row{display:flex;gap:5px;align-items:center;justify-content:flex-end}
  .preview .pv-label{font-size:12px;color:#56645b;margin-right:auto;padding-right:8px}
  .preview button{font:inherit;font-size:12px;border:1px solid #c9d8cb;background:#fff;color:#1f2d24;
    border-radius:999px;padding:4px 9px;cursor:pointer}
  .preview button.on{background:#1f6f3a;border-color:#1f6f3a;color:#fff}
  .preview button:disabled{opacity:.45;cursor:default}
  .pop b{font-size:14px}
  .pop .muted{color:#56645b}
</style></head><body>
<div id="map"></div>
<div id="status" class="toast" hidden></div>
<script>
// Apps Script web app URL (Deploy > Manage deployments), ending in /exec
var DATA_URL = 'https://script.google.com/macros/s/AKfycbzwHppa_Dd1riWXpchENKyJNhrdF-0Tnp-jpdOT53kwbQwwfuPJdamU06XHJ8D9Pgm6dw/exec';

var data, currentMap, drawn = [];

// Colours were checked for colour-blind separation and against the light
// map. Trees that are due or overdue take a step on RAMP (amber to deep red,
// getting steadily darker) by how far through their watering interval they
// are: due now = 1, a whole interval overdue = 2.
var RAMP = ['#e49a22', '#e48127', '#e2672a', '#d14d2e', '#bf2f2f', '#951f28', '#6d1020'];
var RAMP_FROM = 0.75, RAMP_TO = 2.5;
var colours = {ok:'#1b9e77', soon: RAMP[0], overdue: RAMP[4], never:'#5d6d7e', rest:'#7096d4', amey:'#c2c8cd'};

// Amey trees get their own colour so they don't swamp the map
function key(p) { return p.status === 'rest' && p.rest === 'amey' ? 'amey' : p.status; }

function rampColour(u) {
  var t = Math.min(1, Math.max(0, (u - RAMP_FROM) / (RAMP_TO - RAMP_FROM)));
  return RAMP[Math.round(t * (RAMP.length - 1))];
}

// Data from an older script has no urgency, so falls back to one colour per status
function colourFor(status, urgency) {
  return (status === 'soon' || status === 'overdue') && urgency ? rampColour(urgency) : colours[status];
}

// Days between waterings for this tree (sent by the script; worked out from
// urgency for data from an older script)
function everyDays(p) {
  if (p.every) return p.every;
  return p.urgency && p.days ? Math.round(p.days / p.urgency) : null;
}

// Newly planted (1st year) trees this many days or more past due get a "!"
// badge on the map, on clusters and in the list
var FLAG_GRACE_DAYS = 2;
function flagged(p) {
  if (p.status !== 'overdue' || p.days === null || !/^1st year/.test(p.age || '')) return false;
  var every = everyDays(p);
  return !!every && p.days - every >= FLAG_GRACE_DAYS;
}

// Right-hand text in the list of trees needing water
function dueText(p, every) {
  if (p.status === 'never' || p.days === null) return 'never watered';
  if (!every) return p.days + ' d';
  var over = p.days - every;
  return over > 0 ? over + ' d overdue' : over === 0 ? 'due today' : 'due in ' + (-over) + ' d';
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
}
// Demo panel for trying other seasons and drought mode. Temporary: set to
// false to hide it again, after which only ?preview links show it.
// ?preview=in / ?preview=out and ?drought=on / ?drought=off open a view directly.
var DEMO_CONTROLS = true;
var params = new URLSearchParams(location.search);
var preview = {season: params.get('preview') || 'actual', drought: params.get('drought') || 'actual'};
if (['actual', 'in', 'out'].indexOf(preview.season) < 0) preview.season = 'actual';
if (['actual', 'on', 'off'].indexOf(preview.drought) < 0) preview.drought = 'actual';
var showPreview = DEMO_CONTROLS || params.has('preview') || params.has('drought');

function previewing() { return preview.season !== 'actual' || preview.drought !== 'actual'; }

// Copy of the data as it would look in the previewed season and drought mode
function applyPreview(d) {
  if (!previewing()) return d;
  var c = JSON.parse(JSON.stringify(d));
  var drought = preview.drought === 'actual' ? !!d.info.drought : preview.drought === 'on';
  var normal = 'normalSeason' in d.info ? d.info.normalSeason : d.info.inSeason;
  var season = preview.season === 'actual' ? normal : preview.season === 'in';
  // Drought mode switches watering on even out of season
  var mode = drought ? 'drought' : season ? 'in' : 'out';
  c.info.inSeason = drought || season;
  c.info.drought = drought;
  c.points.forEach(function(p) {
    var v = p.views ? p.views[mode] : mode === 'out' ? {status:'rest', rest:'season', due:null} : null;
    if (v) {
      p.status = v.status; p.rest = v.rest; p.due = v.due; p.urgency = v.urgency || 0;
      p.every = v.every || null;
      if (v.interval) p.interval = v.interval;
    }
  });
  return c;
}

function syncUrl() {
  if (preview.season !== 'actual') params.set('preview', preview.season);
  else if (DEMO_CONTROLS) params.delete('preview');
  else params.set('preview', '');
  if (preview.drought !== 'actual') params.set('drought', preview.drought);
  else params.delete('drought');
  var q = params.toString().replace(/preview=(&|$)/, 'preview$1');
  history.replaceState(null, '', q ? '?' + q : location.pathname);
}

function load() {
  var status = document.getElementById('status');
  status.hidden = false;
  status.innerHTML = 'Loading trees\u2026';
  fetch(DATA_URL + '?view=data')
    .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d) { status.hidden = true; data = d; draw(); })
    .catch(function() {
      status.innerHTML = 'Couldn\u2019t load the tree data. <button type="button" id="retry">Try again</button>';
      document.getElementById('retry').onclick = load;
    });
}

function draw() {
  var d = applyPreview(data);
  var pts = d.points;
  var info = d.info;
  info.season = info.season || 'May\u2013Sep';
  info.focus = (params.get('tree') || '').trim().toLowerCase();
  var offSeason = info.inSeason === false;
  var labels = {ok:'Watered recently', never:'No watering recorded',
    rest:'Established — no regular watering', amey:'Watered weekly by Amey'};
  var first = !currentMap;
  var map = currentMap = currentMap || setupMap(d.tileUrl);
  drawn.forEach(function(x){ x.remove(); });
  drawn = [];

  function popupHtml(p) {
    var h = '<div class="pop"><b>' + esc(p.species) + '</b><br><span class="muted">' + esc(p.location) + '</span>';
    if (p.planted) h += '<br><span class="muted">Planted ' + esc(p.planted) + (p.age ? ' · ' + esc(p.age) : '') + '</span>';
    if (p.responsibility) h += '<br><span class="muted">Looked after by: ' + esc(p.responsibility) + '</span>';
    h += '<br><br>';
    if (p.lastTap) h += 'Last watered: ' + p.lastTap + '<br>';
    else h += 'No watering recorded yet<br>';
    if (p.rainReset && info.rain) h += 'Heavy rain (' + info.rain.mm + ' mm, ' + info.rain.when + ') counted as a watering<br>';
    else if (p.fromSeasonStart && p.due) h += 'Counted from the start of the season<br>';
    if (p.rest === 'season') h += 'Out of season (' + info.season + ') — water only in a long dry spell<br>';
    else if (p.interval) h += esc(p.interval) + '<br>';
    if (p.due) h += (p.status === 'overdue' ? '<b style="color:' + colours.overdue + '">Overdue</b> since ' : 'Next due: ') + p.due + '<br>';
    if (p.litres7) h += 'About ' + p.litres7 + ' L logged in the last 7 days' +
      (p.litresAssumed ? ' <span class="muted">(' + p.litresAssumed + ' without an amount, counted as ' +
        (info.defaultLitres || 5) + ' L)</span>' : '') + '<br>';
    h += '<span class="muted">Waterings: ' + p.count30 + ' in last 30 days · ' + p.countYear + ' this year</span></div>';
    return h;
  }

  var rank = {amey:-2, rest:-1, ok:0, soon:1, never:2, overdue:3};
  var cluster = L.markerClusterGroup({
    maxClusterRadius: 45,
    // A cluster takes the colour of its most urgent tree
    // and a "!" badge counting its newly planted overdue trees
    iconCreateFunction: function(c) {
      var worst = 'amey', u = 0, flags = 0;
      c.getAllChildMarkers().forEach(function(m){
        var s = m.options._status;
        if (rank[s] > rank[worst]) { worst = s; u = 0; }
        if (s === worst) u = Math.max(u, m.options._urgency || 0);
        if (m.options._flag) flags++;
      });
      return L.divIcon({
        html: '<div class="cl"><div style="background:'+colourFor(worst, u)+';width:34px;height:34px;'+
              'box-sizing:border-box;border-radius:50%;border:2.5px solid #fff;color:#fff;font:600 13px sans-serif;'+
              'display:flex;align-items:center;justify-content:center;">'+c.getChildCount()+'</div>'+
              (flags ? '<span class="flag" title="' + flags + ' newly planted and overdue">!' +
                (flags > 1 ? ' ' + flags : '') + '</span>' : '') + '</div>',
        className: '', iconSize: [34,34]
      });
    }
  });

  var bounds = [], markers = {}, badges = [];
  pts.forEach(function(p){
    // Amey trees are smaller circles
    var flag = flagged(p);
    var m = L.circleMarker([p.lat, p.lng], {radius: p.amey ? 6 : 10, weight: p.amey ? 2 : 2.5,
      color:'#fff', fillColor: colourFor(key(p), p.urgency), fillOpacity:1, _status: key(p), _urgency: p.urgency,
      _flag: flag});
    m.bindPopup(popupHtml(p));
    cluster.addLayer(m);
    markers[p.id] = m;
    bounds.push([p.lat, p.lng]);
    if (flag) {
      // Badge sits on the dot's top-right edge; tapping it opens the tree
      var r = p.amey ? 6 : 9;
      var b = L.marker([p.lat, p.lng], {keyboard:false, zIndexOffset:1000, title:'Newly planted and overdue',
        icon: L.divIcon({className:'', iconSize:[16,16], iconAnchor:[8 - r, 8 + r], html:'<span class="flag">!</span>'})});
      b.on('click', function(){ m.openPopup(); });
      b._tree = m;
      badges.push(b);
    }
  });
  map.addLayer(cluster);
  drawn.push(cluster);

  // Tree badges show only while their tree is shown on its own (not inside a
  // cluster or fanned out); clusters carry their own badge
  var badgeLayer = L.layerGroup().addTo(map), spread = [];
  function updateBadges() {
    badges.forEach(function(b){
      // The cluster library only adds a tree's own dot to the map when it is
      // shown unclustered (its getVisibleParent only works for HTML markers)
      var show = map.hasLayer(b._tree) && spread.indexOf(b._tree) < 0;
      if (show && !badgeLayer.hasLayer(b)) badgeLayer.addLayer(b);
      else if (!show && badgeLayer.hasLayer(b)) badgeLayer.removeLayer(b);
    });
  }
  function hideBadges() { badgeLayer.clearLayers(); }
  cluster.on('animationend', updateBadges);
  cluster.on('spiderfied', function(e){ spread = e.markers; updateBadges(); });
  cluster.on('unspiderfied', function(){ spread = []; updateBadges(); });
  map.on('zoomstart', hideBadges);
  map.on('moveend', updateBadges);
  drawn.push({remove: function(){
    map.off('zoomstart', hideBadges); map.off('moveend', updateBadges); badgeLayer.remove();
  }});
  if (first) {
    if (bounds.length) map.fitBounds(bounds, {padding:[40,40], maxZoom:17});
    else map.setView([53.48, -1.49], 15);
  }
  updateBadges();

  function showTree(id) {
    var m = markers[id];
    if (m) cluster.zoomToShowLayer(m, function(){ m.openPopup(); });
  }
  if (first && info.focus) showTree(info.focus);

  // Legend
  var legend = L.control({position:'bottomleft'});
  legend.onAdd = function() {
    var d = L.DomUtil.create('div', 'panel legend');
    var h = '';
    function row(s) {
      return '<div class="row"><span class="dot" style="background:' + colours[s] + '"></span>' + labels[s] + '</div>';
    }
    if (!offSeason) {
      h += row('ok');
      // How overdue, for the tree's age: the same steps the markers use
      h += '<div class="ramp"><div class="bar" style="background:linear-gradient(to right,' + RAMP.join(',') +
        ')"></div><div class="ends"><span>Due soon</span><span>Overdue</span><span>Very overdue</span></div></div>';
    }
    if (pts.some(function(p){ return p.status === 'never'; })) h += row('never');
    if (offSeason) labels.rest = 'Out of season (' + info.season + ') — no watering needed';
    if (offSeason || pts.some(function(p){ return key(p) === 'rest'; })) h += row('rest');
    if (pts.some(function(p){ return key(p) === 'amey'; })) h += row('amey');
    if (badges.length) h += '<div class="row"><span class="flag">!</span>Newly planted (1st year), ' +
      FLAG_GRACE_DAYS + '+ days overdue</div>';
    h += '<div class="shapes"><span class="row"><span class="dot hollow"></span>Community tree</span>' +
      '<span class="row"><span class="dot hollow small"></span>Amey tree</span></div>';
    if (info.drought) h += '<div class="note"><b>Drought mode is on.</b> Young trees need water more often, ' +
      'and young Amey trees need a top-up too.</div>';
    else if (!offSeason) h += '<div class="note">Overdueness is measured against how often each tree needs ' +
      'water; younger trees turn red sooner.</div>';
    h += '<div class="note">' + (info.rainError ? 'Rain data unavailable right now.' :
      'Heavy rain (' + info.rainMm + ' mm+ in 48 h) counts as a watering.' +
      (info.rain ? ' Last: ' + info.rain.when + '.' :
        ' None in the last ' + (info.rainDays || Math.min(92, info.overdue + 7)) + ' days.')) +
      '<br>Updated ' + info.updated + '</div>';
    d.innerHTML = h;
    L.DomEvent.disableClickPropagation(d);
    return d;
  };
  drawn.push(legend.addTo(map));

  // Trees needing water, collapsed by default so the map stays the focus
  // Worst status first, then by urgency (days since watering ÷ the tree's
  // interval), so younger trees come before older ones dry for the same time
  var needy = pts.filter(function(p){ return p.status !== 'ok' && p.status !== 'rest'; }).sort(function(a, b){
    return rank[b.status] - rank[a.status] || (b.urgency || 0) - (a.urgency || 0) || (b.days || 0) - (a.days || 0);
  });
  var due = L.control({position:'topright'});
  due.onAdd = function() {
    var d = L.DomUtil.create('div', 'panel due');
    L.DomEvent.disableClickPropagation(d);
    L.DomEvent.disableScrollPropagation(d);
    var btn = L.DomUtil.create('button', '', d);
    if (!needy.length) {
      btn.textContent = offSeason ? 'Out of season — no watering needed' : '✓ All trees watered';
      return d;
    }
    // The button also counts newly planted overdue trees, behind a "!" badge
    btn.innerHTML = needy.length + (needy.length === 1 ? ' tree needs' : ' trees need') + ' water' +
      (badges.length ? ' <span class="flag" title="Newly planted and overdue">!</span> ' + badges.length : '') +
      ' <span class="arrow">▾</span>';
    btn.setAttribute('aria-expanded', 'false');
    var drop = L.DomUtil.create('div', 'drop', d);
    drop.hidden = true;
    drop.innerHTML = '<p class="head"><b>Most urgent at the top based on each tree\'s age and watering history</b>' + (badges.length ? ' <span class="flag sm">!</span>marks ' +
      'newly planted trees ' + FLAG_GRACE_DAYS + '+ days overdue.' : '') + '</p>';
    var ol = L.DomUtil.create('ol', '', drop);
    function toggle(open) {
      drop.hidden = !open;
      d.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.querySelector('.arrow').textContent = open ? '▴' : '▾';
    }
    needy.forEach(function(p, i){
      var li = L.DomUtil.create('li', '', ol);
      var every = everyDays(p);
      var sub = [p.age ? p.age.replace(' after planting', '') : '', every ? 'every ' + every + ' d' : '',
        p.amey ? 'Amey tree' : ''].filter(Boolean).join(' · ');
      li.innerHTML = '<span class="n">' + (i + 1) + '.</span>' +
        '<span class="dot" style="background:' + colourFor(p.status, p.urgency) + '"></span>' +
        '<span class="t">' + esc(p.species) + ', ' + esc(p.location) +
        (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') + '</span>' +
        '<small>' + (flagged(p) ? '<span class="flag sm" title="Newly planted and overdue">!</span>' : '') +
        dueText(p, every) + '</small>';
      li.onclick = function(){ toggle(false); showTree(p.id); };
    });
    btn.onclick = function(){ toggle(drop.hidden); };
    return d;
  };
  drawn.push(due.addTo(map));

  if (showPreview) {
    var pv = L.control({position:'topleft'});
    pv.onAdd = function() {
      var el = L.DomUtil.create('div', 'panel preview');
      L.DomEvent.disableClickPropagation(el);
      el.innerHTML = '<div class="pv-title">' + (previewing() ? 'Preview \u2014 not the real status' :
        'Demo: try other conditions') + '</div>';
      var hasViews = data.points.every(function(p){ return p.views; });
      var hasDrought = data.points.every(function(p){ return p.views && p.views.drought; });
      var realDrought = !!data.info.drought;
      function group(label, opts, current, set) {
        var row = L.DomUtil.create('div', 'pv-row', el);
        L.DomUtil.create('span', 'pv-label', row).textContent = label;
        opts.forEach(function(o){
          var b = L.DomUtil.create('button', o[0] === current ? 'on' : '', row);
          b.type = 'button'; b.textContent = o[1];
          b.setAttribute('aria-pressed', o[0] === current ? 'true' : 'false');
          if (o[2]) { b.disabled = true; b.title = 'Needs the latest script deployed'; }
          b.onclick = function(){ set(o[0]); syncUrl(); draw(); };
        });
      }
      group('Season', [['actual', 'Today'], ['in', 'In', data.info.inSeason === false && !hasViews],
        ['out', 'Out']], preview.season, function(v){ preview.season = v; });
      var droughtOn = preview.drought === 'actual' ? realDrought : preview.drought === 'on';
      group('Drought', [['off', 'Off'], ['on', 'On', !hasDrought && !realDrought]], droughtOn ? 'on' : 'off',
        function(v){ preview.drought = (v === 'on') === realDrought ? 'actual' : v; });
      // The live data comes from the deployed Apps Script; an older version
      // doesn't send the drought view, so say why the button is greyed out
      if (!hasDrought) L.DomUtil.create('div', 'pv-note', el).textContent =
        'Drought preview needs the updated script: in Apps Script, Deploy > Manage deployments > Edit > New version.';
      return el;
    };
    drawn.push(pv.addTo(map));
  }

}

function toast(msg) {
  var t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 4000);
}

// The map, tiles and location button are made once. Redraws (the demo
// toggles) only swap the markers and panels, so the view and loaded tiles stay.
function setupMap(tileUrl) {
  // Markers are drawn on one canvas rather than as an element per tree,
  // which keeps panning and zooming smooth. The extra padding draws trees a
  // little way off-screen, so they don't pop in at the edges after a pan.
  var map = L.map('map', {maxZoom:20, renderer: L.canvas({padding:0.5, tolerance:5})});
  // Tiles stop at 18 and are enlarged beyond that. keepBuffer holds on to
  // more tiles around the view, so panning back doesn't show grey squares.
  L.tileLayer(tileUrl,
    {attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions" target="_blank">CARTO</a>', subdomains:'abcd', maxNativeZoom:18, maxZoom:20, keepBuffer:4}).addTo(map);

  // Show my location
  var locate = L.control({position:'topleft'});
  var me = null;
  locate.onAdd = function() {
    var d = L.DomUtil.create('div', 'leaflet-bar');
    var b = L.DomUtil.create('button', 'locate', d);
    b.title = 'Show my location'; b.setAttribute('aria-label', 'Show my location');
    b.textContent = '◎';
    L.DomEvent.disableClickPropagation(d);
    b.onclick = function(){
      if (!navigator.geolocation) return toast('Location isn’t available on this device.');
      map.locate({setView:true, maxZoom:17});
    };
    return d;
  };
  locate.addTo(map);
  map.on('locationfound', function(e){
    if (me) map.removeLayer(me);
    me = L.layerGroup([
      L.circle(e.latlng, {radius:e.accuracy, color:'#2e86de', weight:1, fillOpacity:.1, interactive:false}),
      L.circleMarker(e.latlng, {radius:7, color:'#fff', weight:2.5, fillColor:'#2e86de', fillOpacity:1, interactive:false})
    ]).addTo(map);
  });
  map.on('locationerror', function(e){
    toast(e.code === 1 ? 'Location permission was blocked, so we can’t show where you are.'
                       : 'Couldn’t find your location just now.');
  });
  return map;
}

load();
