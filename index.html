<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NESST Tree Watering Map</title>
<meta name="description" content="Which of the NESST street trees need watering, updated from volunteer tag taps and local rainfall.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css"/>
<script src="vendor/leaflet/leaflet.js"></script>
<link rel="stylesheet" href="vendor/leaflet.markercluster/MarkerCluster.css"/>
<script src="vendor/leaflet.markercluster/leaflet.markercluster.js"></script>
<style>
  html,body,#map{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,sans-serif}
  .panel{background:#fff;border-radius:10px;box-shadow:0 1px 5px rgba(0,0,0,.25);
    font-size:13px;color:#1f2d24;line-height:1.35}
  .legend{padding:8px 10px;max-width:220px}
  .legend .row{display:flex;align-items:center;gap:7px;margin:2px 0}
  .dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff;
    box-shadow:0 0 0 1px rgba(0,0,0,.15);flex:none}
  .dot.sq{border-radius:3px}
  .dot.hollow{background:#fff;box-shadow:none;border-color:#1f2d24}
  .legend .note{color:#56645b;font-size:11.5px;margin-top:6px}
  .legend .shapes{display:flex;gap:12px;margin-top:6px;padding-top:6px;border-top:1px solid #e3e9e4}  .due{max-width:240px}
  .due button{all:unset;cursor:pointer;display:block;padding:7px 11px;font-weight:600}
  .due ul{list-style:none;margin:0;padding:0 0 4px;max-height:40vh;overflow:auto;
    border-top:1px solid #e3e9e4}
  .due li{display:flex;gap:7px;align-items:center;padding:6px 11px;cursor:pointer}
  .due li:hover{background:#f1f5f1}
  .due li small{color:#56645b;margin-left:auto;white-space:nowrap}
  .locate{all:unset;cursor:pointer;width:30px;height:30px;display:flex;align-items:center;
    justify-content:center;background:#fff;font-size:17px}
  .toast button{font:inherit;margin-left:6px}
  .toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:1000;
    background:#1f2d24;color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;
    max-width:80vw;text-align:center}
  .preview{padding:7px 9px;display:flex;flex-direction:column;gap:6px;max-width:250px}
  .preview .pv-title{font-weight:600;font-size:12px;color:#56645b}
  .preview .pv-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:flex-end}
  .preview .pv-label{font-size:12px;color:#56645b;margin-right:auto}
  .preview button{font:inherit;font-size:12px;border:1px solid #c9d8cb;background:#fff;color:#1f2d24;
    border-radius:999px;padding:4px 9px;cursor:pointer}
  .preview button.on{background:#1f6f3a;border-color:#1f6f3a;color:#fff}
  .preview button:disabled{opacity:.45;cursor:default}
  .pop b{font-size:14px}
  .pop .muted{color:#56645b}
</style></head><body>
<div id="map"></div>
<div id="status" class="toast" hidden></div>
<script>
// Apps Script web app URL (Deploy > Manage deployments), ending in /exec
var DATA_URL = 'https://script.google.com/macros/s/AKfycbzwHppa_Dd1riWXpchENKyJNhrdF-0Tnp-jpdOT53kwbQwwfuPJdamU06XHJ8D9Pgm6dw/exec';

var data, currentMap, drawn = [];

// Amey trees: a square drawn on the same canvas as the community circles
var SquareMarker = L.CircleMarker.extend({
  _updatePath: function() {
    var r = this._renderer;
    if (!r._ctx) return L.CircleMarker.prototype._updatePath.call(this); // non-canvas fallback: circle
    if (!r._drawing || this._empty()) return;
    var p = this._point, s = Math.max(Math.round(this._radius), 1);
    r._ctx.beginPath();
    r._ctx.rect(p.x - s, p.y - s, s * 2, s * 2);
    r._fillStroke(r._ctx, this);
  }
});
// Demo panel for trying other seasons and drought mode. Temporary: set to
// false to hide it again, after which only ?preview links show it.
// ?preview=in / ?preview=out and ?drought=on / ?drought=off open a view directly.
var DEMO_CONTROLS = true;
var params = new URLSearchParams(location.search);
var preview = {season: params.get('preview') || 'actual', drought: params.get('drought') || 'actual'};
if (['actual', 'in', 'out'].indexOf(preview.season) < 0) preview.season = 'actual';
if (['actual', 'on', 'off'].indexOf(preview.drought) < 0) preview.drought = 'actual';
var showPreview = DEMO_CONTROLS || params.has('preview') || params.has('drought');

function previewing() { return preview.season !== 'actual' || preview.drought !== 'actual'; }

// Copy of the data as it would look in the previewed season and drought mode
function applyPreview(d) {
  if (!previewing()) return d;
  var c = JSON.parse(JSON.stringify(d));
  var drought = preview.drought === 'actual' ? !!d.info.drought : preview.drought === 'on';
  var normal = 'normalSeason' in d.info ? d.info.normalSeason : d.info.inSeason;
  var season = preview.season === 'actual' ? normal : preview.season === 'in';
  // Drought mode switches watering on even out of season
  var mode = drought ? 'drought' : season ? 'in' : 'out';
  c.info.inSeason = drought || season;
  c.info.drought = drought;
  c.points.forEach(function(p) {
    var v = p.views ? p.views[mode] : mode === 'out' ? {status:'rest', rest:'season', due:null} : null;
    if (v) {
      p.status = v.status; p.rest = v.rest; p.due = v.due; p.urgency = v.urgency || 0;
      if (v.interval) p.interval = v.interval;
    }
  });
  return c;
}

function syncUrl() {
  if (preview.season !== 'actual') params.set('preview', preview.season);
  else if (DEMO_CONTROLS) params.delete('preview');
  else params.set('preview', '');
  if (preview.drought !== 'actual') params.set('drought', preview.drought);
  else params.delete('drought');
  var q = params.toString().replace(/preview=(&|$)/, 'preview$1');
  history.replaceState(null, '', q ? '?' + q : location.pathname);
}

function load() {
  var status = document.getElementById('status');
  status.hidden = false;
  status.innerHTML = 'Loading trees\u2026';
  fetch(DATA_URL + '?view=data')
    .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d) { status.hidden = true; data = d; draw(); })
    .catch(function() {
      status.innerHTML = 'Couldn\u2019t load the tree data. <button type="button" id="retry">Try again</button>';
      document.getElementById('retry').onclick = load;
    });
}

function draw() {
  var d = applyPreview(data);
  var pts = d.points;
  var info = d.info;
  info.season = info.season || 'May\u2013Sep';
  info.focus = (params.get('tree') || '').trim().toLowerCase();
  var colours = {overdue:'#c0392b', never:'#5d6d7e', soon:'#e67e22', ok:'#27ae60', rest:'#7f9cc0', amey:'#b4bec6'};
  var offSeason = info.inSeason === false;
  var labels = {ok:'Watered recently', soon:'Due within 2 days', overdue:'Overdue',
    never:'No watering recorded', rest:'Established — no regular watering', amey:'Watered weekly by Amey'};
  // Amey trees get their own colour so they don't swamp the map
  function key(p) { return p.status === 'rest' && p.rest === 'amey' ? 'amey' : p.status; }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
  }
  var first = !currentMap;
  var map = currentMap = currentMap || setupMap(d.tileUrl);
  drawn.forEach(function(x){ x.remove(); });
  drawn = [];

  function popupHtml(p) {
    var h = '<div class="pop"><b>' + esc(p.species) + '</b><br><span class="muted">' + esc(p.location) + '</span>';
    if (p.planted) h += '<br><span class="muted">Planted ' + esc(p.planted) + (p.age ? ' · ' + esc(p.age) : '') + '</span>';
    if (p.responsibility) h += '<br><span class="muted">Looked after by: ' + esc(p.responsibility) + '</span>';
    h += '<br><br>';
    if (p.lastTap) h += 'Last watered: ' + p.lastTap + '<br>';
    else h += 'No watering recorded yet<br>';
    if (p.rainReset && info.rain) h += 'Heavy rain (' + info.rain.mm + ' mm, ' + info.rain.when + ') counted as a watering<br>';
    else if (p.fromSeasonStart && p.due) h += 'Counted from the start of the season<br>';
    if (p.rest === 'season') h += 'Out of season (' + info.season + ') — water only in a long dry spell<br>';
    else if (p.interval) h += esc(p.interval) + '<br>';
    if (p.due) h += (p.status === 'overdue' ? '<b style="color:' + colours.overdue + '">Overdue</b> since ' : 'Next due: ') + p.due + '<br>';
    if (p.litres7) h += 'About ' + p.litres7 + ' L logged in the last 7 days' +
      (p.litresAssumed ? ' <span class="muted">(' + p.litresAssumed + ' without an amount, counted as ' +
        (info.defaultLitres || 5) + ' L)</span>' : '') + '<br>';
    h += '<span class="muted">Waterings: ' + p.count30 + ' in last 30 days · ' + p.countYear + ' this year</span></div>';
    return h;
  }

  var rank = {amey:-2, rest:-1, ok:0, soon:1, never:2, overdue:3};
  var cluster = L.markerClusterGroup({
    maxClusterRadius: 45,
    iconCreateFunction: function(c) {
      var worst = 'amey';
      c.getAllChildMarkers().forEach(function(m){
        if (rank[m.options._status] > rank[worst]) worst = m.options._status;
      });
      return L.divIcon({
        html: '<div style="background:'+colours[worst]+';width:34px;height:34px;'+
              'border-radius:50%;border:2.5px solid #fff;color:#fff;font:600 13px sans-serif;'+
              'display:flex;align-items:center;justify-content:center;">'+c.getChildCount()+'</div>',
        className: '', iconSize: [34,34]
      });
    }
  });

  var bounds = [], markers = {};
  pts.forEach(function(p){
    // Circles for community trees, smaller squares for Amey trees
    var style = {color:'#fff', fillColor: colours[key(p)], fillOpacity:1, _status: key(p)};
    var m = p.amey ? new SquareMarker([p.lat, p.lng], L.extend({radius:6, weight:2}, style))
                   : L.circleMarker([p.lat, p.lng], L.extend({radius:10, weight:2.5}, style));
    m.bindPopup(popupHtml(p));
    cluster.addLayer(m);
    markers[p.id] = m;
    bounds.push([p.lat, p.lng]);
  });
  map.addLayer(cluster);
  drawn.push(cluster);
  if (first) {
    if (bounds.length) map.fitBounds(bounds, {padding:[40,40], maxZoom:17});
    else map.setView([53.48, -1.49], 15);
  }

  function showTree(id) {
    var m = markers[id];
    if (m) cluster.zoomToShowLayer(m, function(){ m.openPopup(); });
  }
  if (first && info.focus) showTree(info.focus);

  // Legend
  var legend = L.control({position:'bottomleft'});
  legend.onAdd = function() {
    var d = L.DomUtil.create('div', 'panel legend');
    var h = '';
    var rows = offSeason ? [] : ['ok','soon','overdue'];
    if (pts.some(function(p){ return p.status === 'never'; })) rows.push('never');
    if (offSeason) labels.rest = 'Out of season (' + info.season + ') — no watering needed';
    if (offSeason || pts.some(function(p){ return key(p) === 'rest'; })) rows.push('rest');
    if (pts.some(function(p){ return key(p) === 'amey'; })) rows.push('amey');
    rows.forEach(function(s){
      h += '<div class="row"><span class="dot' + (s === 'amey' ? ' sq' : '') + '" style="background:' +
        colours[s] + '"></span>' + labels[s] + '</div>';
    });
    h += '<div class="shapes"><span class="row"><span class="dot hollow"></span>Community tree</span>' +
      '<span class="row"><span class="dot hollow sq"></span>Amey tree</span></div>';
    if (info.drought) h += '<div class="note"><b>Drought mode is on.</b> Young trees need water more often, ' +
      'and young Amey trees need a top-up too.</div>';
    else if (!offSeason) h += '<div class="note">The list of trees needing water puts the most urgent first: ' +
      'younger trees need water more often.</div>';
    h += '<div class="note">' + (info.rainError ? 'Rain data unavailable right now.' :
      'Heavy rain (' + info.rainMm + ' mm+ in 48 h) counts as a watering.' +
      (info.rain ? ' Last: ' + info.rain.when + '.' :
        ' None in the last ' + (info.rainDays || Math.min(92, info.overdue + 7)) + ' days.')) +
      '<br>Updated ' + info.updated + '</div>';
    d.innerHTML = h;
    L.DomEvent.disableClickPropagation(d);
    return d;
  };
  drawn.push(legend.addTo(map));

  // Trees needing water, collapsed by default so the map stays the focus
  // Worst status first, then by urgency (days since watering ÷ the tree's
  // interval), so younger trees come before older ones dry for the same time
  var needy = pts.filter(function(p){ return p.status !== 'ok' && p.status !== 'rest'; }).sort(function(a, b){
    return rank[b.status] - rank[a.status] || (b.urgency || 0) - (a.urgency || 0) || (b.days || 0) - (a.days || 0);
  });
  var due = L.control({position:'topright'});
  due.onAdd = function() {
    var d = L.DomUtil.create('div', 'panel due');
    L.DomEvent.disableClickPropagation(d);
    L.DomEvent.disableScrollPropagation(d);
    var btn = L.DomUtil.create('button', '', d);
    if (!needy.length) {
      btn.textContent = offSeason ? 'Out of season — no watering needed' : '✓ All trees watered';
      return d;
    }
    btn.textContent = needy.length + (needy.length === 1 ? ' tree needs' : ' trees need') + ' water ▾';
    var ul = L.DomUtil.create('ul', '', d);
    ul.style.display = 'none';
    needy.forEach(function(p){
      var li = L.DomUtil.create('li', '', ul);
      li.innerHTML = '<span class="dot" style="background:'+colours[p.status]+'"></span>' +
        '<span>' + esc(p.species) + ', ' + esc(p.location) + '</span>' +
        '<small>' + (p.days === null ? 'never' : p.days + ' d') + '</small>';
      li.onclick = function(){ ul.style.display = 'none'; showTree(p.id); };
    });
    btn.onclick = function(){ ul.style.display = ul.style.display === 'none' ? '' : 'none'; };
    return d;
  };
  drawn.push(due.addTo(map));

  if (showPreview) {
    var pv = L.control({position:'topright'});
    pv.onAdd = function() {
      var el = L.DomUtil.create('div', 'panel preview');
      L.DomEvent.disableClickPropagation(el);
      el.innerHTML = '<div class="pv-title">' + (previewing() ? 'Preview \u2014 not the real status' :
        'Demo: try other conditions') + '</div>';
      var hasViews = data.points.every(function(p){ return p.views; });
      var hasDrought = data.points.every(function(p){ return p.views && p.views.drought; });
      var realDrought = !!data.info.drought;
      function group(label, opts, current, set) {
        var row = L.DomUtil.create('div', 'pv-row', el);
        L.DomUtil.create('span', 'pv-label', row).textContent = label;
        opts.forEach(function(o){
          var b = L.DomUtil.create('button', o[0] === current ? 'on' : '', row);
          b.type = 'button'; b.textContent = o[1];
          b.setAttribute('aria-pressed', o[0] === current ? 'true' : 'false');
          if (o[2]) { b.disabled = true; b.title = 'Needs the latest script deployed'; }
          b.onclick = function(){ set(o[0]); syncUrl(); draw(); };
        });
      }
      group('Season', [['actual', 'Today'], ['in', 'In season', data.info.inSeason === false && !hasViews],
        ['out', 'Out of season']], preview.season, function(v){ preview.season = v; });
      var droughtOn = preview.drought === 'actual' ? realDrought : preview.drought === 'on';
      group('Drought', [['off', 'Off'], ['on', 'On', !hasDrought && !realDrought]], droughtOn ? 'on' : 'off',
        function(v){ preview.drought = (v === 'on') === realDrought ? 'actual' : v; });
      return el;
    };
    drawn.push(pv.addTo(map));
  }

}

function toast(msg) {
  var t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 4000);
}

// The map, tiles and location button are made once. Redraws (the demo
// toggles) only swap the markers and panels, so the view and loaded tiles stay.
function setupMap(tileUrl) {
  // Markers are drawn on one canvas rather than as an element per tree,
  // which keeps panning and zooming smooth. The extra padding draws trees a
  // little way off-screen, so they don't pop in at the edges after a pan.
  var map = L.map('map', {maxZoom:20, renderer: L.canvas({padding:0.5, tolerance:5})});
  // Tiles stop at 18 and are enlarged beyond that. keepBuffer holds on to
  // more tiles around the view, so panning back doesn't show grey squares.
  L.tileLayer(tileUrl,
    {attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions" target="_blank">CARTO</a>', subdomains:'abcd', maxNativeZoom:18, maxZoom:20, keepBuffer:4}).addTo(map);

  // Show my location
  var locate = L.control({position:'topleft'});
  var me = null;
  locate.onAdd = function() {
    var d = L.DomUtil.create('div', 'leaflet-bar');
    var b = L.DomUtil.create('button', 'locate', d);
    b.title = 'Show my location'; b.setAttribute('aria-label', 'Show my location');
    b.textContent = '◎';
    L.DomEvent.disableClickPropagation(d);
    b.onclick = function(){
      if (!navigator.geolocation) return toast('Location isn’t available on this device.');
      map.locate({setView:true, maxZoom:17});
    };
    return d;
  };
  locate.addTo(map);
  map.on('locationfound', function(e){
    if (me) map.removeLayer(me);
    me = L.layerGroup([
      L.circle(e.latlng, {radius:e.accuracy, color:'#2e86de', weight:1, fillOpacity:.1, interactive:false}),
      L.circleMarker(e.latlng, {radius:7, color:'#fff', weight:2.5, fillColor:'#2e86de', fillOpacity:1, interactive:false})
    ]).addTo(map);
  });
  map.on('locationerror', function(e){
    toast(e.code === 1 ? 'Location permission was blocked, so we can’t show where you are.'
                       : 'Couldn’t find your location just now.');
  });
  return map;
}

load();
</script></body></html>
